<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 860 600" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Multi-Head, Grouped-Query und Multi-Query Attention im Vergleich, dazu der Uptraining-Ablauf</title>
<desc>Alle drei Varianten haben acht Query-Heads. MHA hat acht Key-Value-Heads, GQA vier, MQA einen einzigen. Darunter der Ablauf vom MHA-Checkpoint über Mittelung zu einem GQA-Modell.</desc>

<style>
  .bg   { fill: #ffffff; }
  .hd   { fill: #2C2C2A; font-size: 17px; font-weight: 500; }
  .hds  { fill: #5F5E5A; font-size: 13px; }
  .col  { fill: #2C2C2A; font-size: 15px; font-weight: 500; }
  .cols { fill: #5F5E5A; font-size: 12px; }
  .lab  { fill: #5F5E5A; font-size: 13px; }
  .note { fill: #2C2C2A; font-size: 13px; }
  .cont { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
  .q    { fill: #9FE1CB; stroke: #0F6E56; stroke-width: 0.5; }
  .kv   { fill: #FAC775; stroke: #854F0B; stroke-width: 0.5; }
  .kvt  { fill: #412402; font-size: 12px; font-weight: 500; }
  .link { stroke: #888780; stroke-width: 1; fill: none; }
  .pb   { fill: #CECBF6; stroke: #534AB7; stroke-width: 0.5; }
  .pt   { fill: #26215C; font-size: 14px; font-weight: 500; }
  .ps   { fill: #534AB7; font-size: 12px; }
  .arr  { stroke: #888780; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #1a1a19; }
    .hd, .col, .note { fill: #E8E6DE; }
    .hds, .cols, .lab { fill: #B4B2A9; }
    .cont { fill: #232322; stroke: #B4B2A9; }
    .q    { fill: #085041; stroke: #5DCAA5; }
    .kv   { fill: #633806; stroke: #EF9F27; }
    .kvt  { fill: #FAEEDA; }
    .link, .arr { stroke: #9C9A92; }
    .pb   { fill: #3C3489; stroke: #AFA9EC; }
    .pt   { fill: #EEEDFE; } .ps { fill: #CECBF6; }
  }
</style>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
