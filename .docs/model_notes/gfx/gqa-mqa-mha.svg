<rect class="bg" x="0" y="0" width="860" height="600"/>

<text class="hd" x="20" y="42">Alle drei haben 8 Query-Heads — der Unterschied liegt bei Keys und Values</text>
<text class="hds" x="20" y="64">Weniger Key/Value-Heads bedeutet kleinerer KV-Cache und damit weniger Daten pro Decoding-Schritt</text>

<rect class="cont" x="20" y="82" width="820" height="262" rx="16"/>

<text class="lab" x="115" y="167" text-anchor="end">Query-Heads</text>
<text class="lab" x="115" y="257" text-anchor="end">Key/Value-Heads</text>

<text class="col" x="240" y="112" text-anchor="middle">MHA</text>
<text class="cols" x="240" y="132" text-anchor="middle">8 KV-Heads</text>
<text class="col" x="485" y="112" text-anchor="middle">GQA-4</text>
<text class="cols" x="485" y="132" text-anchor="middle">4 KV-Heads</text>
<text class="col" x="730" y="112" text-anchor="middle">MQA</text>
<text class="cols" x="730" y="132" text-anchor="middle">1 KV-Head</text>

