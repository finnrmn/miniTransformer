<text class="note" x="240" y="300" text-anchor="middle">KV-Cache: 8 Einheiten</text>
<text class="cols" x="240" y="322" text-anchor="middle">beste Qualität, langsamste Inferenz</text>
<text class="note" x="485" y="300" text-anchor="middle">KV-Cache: 4 Einheiten</text>
<text class="cols" x="485" y="322" text-anchor="middle">fast MHA-Qualität, fast MQA-Tempo</text>
<text class="note" x="730" y="300" text-anchor="middle">KV-Cache: 1 Einheit</text>
<text class="cols" x="730" y="322" text-anchor="middle">schnellste Inferenz, Qualität sinkt</text>

<rect class="cont" x="20" y="376" width="820" height="196" rx="16"/>
<text class="hd" x="44" y="408">Uptraining — kein Training von Grund auf</text>

<rect class="pb" x="44" y="432" width="175" height="60" rx="8"/>
<text class="pt" x="131" y="458" text-anchor="middle">MHA-Checkpoint</text>
<text class="ps" x="131" y="478" text-anchor="middle">bereits fertig trainiert</text>

<rect class="pb" x="249" y="432" width="175" height="60" rx="8"/>
<text class="pt" x="336" y="458" text-anchor="middle">K/V-Heads mitteln</text>
<text class="ps" x="336" y="478" text-anchor="middle">mean pooling</text>

<rect class="pb" x="454" y="432" width="175" height="60" rx="8"/>
<text class="pt" x="541" y="458" text-anchor="middle">5 % Nachtraining</text>
<text class="ps" x="541" y="478" text-anchor="middle">α = 0,05</text>

<rect class="pb" x="659" y="432" width="175" height="60" rx="8"/>
<text class="pt" x="746" y="458" text-anchor="middle">GQA-Modell</text>
<text class="ps" x="746" y="478" text-anchor="middle">schnell und genau</text>

<line class="arr" x1="221" y1="462" x2="245" y2="462" marker-end="url(#a)"/>
<line class="arr" x1="426" y1="462" x2="450" y2="462" marker-end="url(#a)"/>
<line class="arr" x1="631" y1="462" x2="655" y2="462" marker-end="url(#a)"/>

<text class="note" x="430" y="528" text-anchor="middle">Mitteln schlägt „ersten Head nehmen" schlägt „zufällig neu initialisieren"</text>
<text class="cols" x="430" y="552" text-anchor="middle">GQA ist schon direkt nach der Umwandlung brauchbar — MQA braucht das Nachtraining zwingend</text>

</svg>
