<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 1060" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>RoPE erklärt: additiv gegen multiplikativ, Rotationsgeometrie, Frequenzpaare</title>
<desc>Oben der Vergleich, wo die Positionsinformation eingespeist wird. Mitte die 2D-Geometrie, in der sich absolute Positionen zu einem relativen Winkel verrechnen. Unten die d halbe Frequenzpaare als unterschiedlich schnelle Zeiger.</desc>

<style>
  .bg   { fill: #ffffff; }
  .hd   { fill: #2C2C2A; font-size: 16px; font-weight: 500; }
  .ct   { fill: #2C2C2A; font-size: 13px; }
  .an   { fill: #5F5E5A; font-size: 13px; }
  .mono { fill: #2C2C2A; font-size: 14px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  .arr  { stroke: #888780; stroke-width: 1.5; fill: none; }
  .axis { stroke: #B4B2A9; stroke-width: 1; fill: none; }
  .circ { stroke: #B4B2A9; stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
  .cont { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
  .gb   { fill: #E4E2DA; stroke: #5F5E5A; stroke-width: 0.5; }
  .gt   { fill: #2C2C2A; font-size: 14px; font-weight: 500; }
  .ab   { fill: #FAC775; stroke: #854F0B; stroke-width: 0.5; }
  .at   { fill: #412402; font-size: 14px; font-weight: 500; }
  .as   { fill: #854F0B; font-size: 13px; }
  .vq   { stroke: #0F6E56; stroke-width: 2.5; fill: none; }
  .vqt  { fill: #0F6E56; font-size: 13px; font-weight: 500; }
  .vk   { stroke: #534AB7; stroke-width: 2.5; fill: none; }
  .vkt  { fill: #534AB7; font-size: 13px; font-weight: 500; }
  .arc  { stroke: #854F0B; stroke-width: 2; fill: none; }
  .hand { stroke: #0F6E56; stroke-width: 2.5; fill: none; }
  .ref  { stroke: #B4B2A9; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #1a1a19; }
    .hd, .ct, .mono { fill: #E8E6DE; }
    .an   { fill: #B4B2A9; }
    .arr, .axis, .circ, .ref { stroke: #9C9A92; }
    .cont { fill: #232322; stroke: #B4B2A9; }
    .gb   { fill: #3A3A37; stroke: #B4B2A9; } .gt { fill: #E8E6DE; }
    .ab   { fill: #633806; stroke: #EF9F27; }
    .at   { fill: #FAEEDA; } .as { fill: #FAC775; }
    .vq, .hand { stroke: #5DCAA5; } .vqt { fill: #5DCAA5; }
    .vk   { stroke: #AFA9EC; } .vkt { fill: #AFA9EC; }
    .arc  { stroke: #EF9F27; }
  }
</style>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="context-stroke"/>
</marker>
</defs>

<rect class="bg" x="0" y="0" width="800" height="1060"/>

<!-- PANEL A -->
<rect class="cont" x="20" y="20" width="760" height="250" rx="16"/>
<text class="hd" x="44" y="52">1 · Wo wird die Position eingespeist?</text>

<text class="an" x="44" y="80">Original-Transformer 2017 — additiv</text>
<rect class="gb" x="44" y="90" width="140" height="42" rx="8"/>
<text class="gt" x="114" y="117" text-anchor="middle">x + p</text>
<rect class="gb" x="214" y="90" width="140" height="42" rx="8"/>
<text class="gt" x="284" y="117" text-anchor="middle">W_q ·</text>
<rect class="gb" x="384" y="90" width="140" height="42" rx="8"/>
<text class="gt" x="454" y="117" text-anchor="middle">q</text>
<line class="arr" x1="186" y1="111" x2="210" y2="111" marker-end="url(#a)"/>
<line class="arr" x1="356" y1="111" x2="380" y2="111" marker-end="url(#a)"/>
<text class="an" x="44" y="155">Position wird ins Inhalts-Embedding addiert — vor der Projektion, nur einmal ganz am Anfang</text>

<text class="an" x="44" y="188">RoPE — multiplikativ</text>
<rect class="gb" x="44" y="198" width="140" height="42" rx="8"/>
<text class="gt" x="114" y="225" text-anchor="middle">x</text>
<rect class="gb" x="214" y="198" width="140" height="42" rx="8"/>
<text class="gt" x="284" y="225" text-anchor="middle">W_q ·</text>
<rect class="ab" x="384" y="198" width="140" height="42" rx="8"/>
<text class="at" x="454" y="225" text-anchor="middle">R(m) ·</text>
<rect class="gb" x="554" y="198" width="140" height="42" rx="8"/>
<text class="gt" x="624" y="225" text-anchor="middle">q_m</text>
<line class="arr" x1="186" y1="219" x2="210" y2="219" marker-end="url(#a)"/>
<line class="arr" x1="356" y1="219" x2="380" y2="219" marker-end="url(#a)"/>
<line class="arr" x1="526" y1="219" x2="550" y2="219" marker-end="url(#a)"/>
<text class="as" x="44" y="262">Der fertige Vektor wird gedreht — nach der Projektion, in jedem Layer neu, nur bei q und k</text>

<!-- PANEL B -->
<rect class="cont" x="20" y="290" width="760" height="370" rx="16"/>
<text class="hd" x="44" y="322">2 · Warum sich die absoluten Positionen wegkürzen</text>

<circle class="circ" cx="230" cy="480" r="120"/>
<line class="axis" x1="100" y1="480" x2="360" y2="480"/>
<line class="axis" x1="230" y1="350" x2="230" y2="610"/>

<line class="vq" x1="230" y1="480" x2="295" y2="379" marker-end="url(#v)"/>
<text class="vqt" x="305" y="368">q  gedreht um m·θ</text>

<line class="vk" x1="230" y1="480" x2="134" y2="408" marker-end="url(#v)"/>
<text class="vkt" x="126" y="396" text-anchor="end">k  gedreht</text>
<text class="vkt" x="126" y="412" text-anchor="end">um n·θ</text>

<path class="arc" d="M259.7 433.7 A 55 55 0 0 0 185.9 447.1"/>
<text class="as" x="205" y="408" text-anchor="middle">(m−n)·θ</text>

<text class="ct" x="230" y="638" text-anchor="middle">Rotation ändert die Länge nicht — nur der eingeschlossene Winkel zählt</text>

<text class="ct" x="410" y="360">Das Skalarprodukt zweier Vektoren hängt</text>
<text class="ct" x="410" y="380">nur ab von: Länge × Länge × cos(Winkel).</text>

<text class="ct" x="410" y="416">Drehe ich q um m·θ und k um n·θ, so</text>
<text class="ct" x="410" y="436">ändert sich der Winkel zwischen ihnen</text>
<text class="ct" x="410" y="456">um genau (m−n)·θ.</text>

<text class="ct" x="410" y="492">Die absoluten Positionen m und n tauchen</text>
<text class="ct" x="410" y="512">im Ergebnis gar nicht mehr auf — übrig</text>
<text class="ct" x="410" y="532">bleibt nur der Abstand.</text>

<rect class="ab" x="410" y="556" width="340" height="70" rx="8"/>
<text class="at" x="430" y="584">Absolut hineingedreht,</text>
<text class="at" x="430" y="608">relativ wieder herausgekommen.</text>

<!-- PANEL C -->
<rect class="cont" x="20" y="680" width="760" height="360" rx="16"/>
<text class="hd" x="44" y="712">3 · Von 2D auf d Dimensionen: d/2 verschieden schnelle Zeiger</text>
<text class="an" x="44" y="738">Der Vektor wird in Paare zerlegt. Jedes Paar ist eine eigene 2D-Ebene mit eigener Drehgeschwindigkeit.</text>

<circle class="circ" cx="130" cy="810" r="52"/>
<line class="ref" x1="130" y1="810" x2="182" y2="810"/>
<line class="hand" x1="130" y1="810" x2="88" y2="779" marker-end="url(#v)"/>
<text class="ct" x="130" y="890" text-anchor="middle">Dim 1–2</text>
<text class="an" x="130" y="910" text-anchor="middle">θ₁ = 1</text>

<circle class="circ" cx="310" cy="810" r="52"/>
<line class="ref" x1="310" y1="810" x2="362" y2="810"/>
<line class="hand" x1="310" y1="810" x2="338" y2="766" marker-end="url(#v)"/>
<text class="ct" x="310" y="890" text-anchor="middle">Dim 3–4</text>
<text class="an" x="310" y="910" text-anchor="middle">θ₂ kleiner</text>

<circle class="circ" cx="490" cy="810" r="52"/>
<line class="ref" x1="490" y1="810" x2="542" y2="810"/>
<line class="hand" x1="490" y1="810" x2="539" y2="792" marker-end="url(#v)"/>
<text class="ct" x="490" y="890" text-anchor="middle">…</text>
<text class="an" x="490" y="910" text-anchor="middle">immer kleiner</text>

<circle class="circ" cx="670" cy="810" r="52"/>
<line class="ref" x1="670" y1="810" x2="722" y2="810"/>
<line class="hand" x1="670" y1="810" x2="722" y2="807" marker-end="url(#v)"/>
<text class="ct" x="670" y="890" text-anchor="middle">Dim d−1, d</text>
<text class="an" x="670" y="910" text-anchor="middle">θ ≈ 0,0001</text>

<text class="an" x="130" y="944" text-anchor="middle">schnell</text>
<text class="an" x="670" y="944" text-anchor="middle">langsam</text>
<line class="arr" x1="180" y1="939" x2="620" y2="939" stroke-dasharray="4 4"/>

<text class="ct" x="400" y="982" text-anchor="middle">Schnelle Paare unterscheiden Nachbarn, langsame Paare grobe Entfernungen —</text>
<text class="ct" x="400" y="1004" text-anchor="middle">wie Sekunden-, Minuten- und Stundenzeiger einer Uhr.</text>
<text class="an" x="400" y="1026" text-anchor="middle">Alle Zeiger zusammen ergeben eine eindeutige Signatur für jede Position.</text>

</svg>
