<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 860 800" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Aktivierungsfunktionen im Vergleich und der Strukturunterschied zwischen Standard-FFN und GLU-FFN</title>
<desc>Oben die Kurven von ReLU, GELU und Swish. ReLU knickt bei null hart ab, GELU und Swish sind glatt und tauchen im leicht negativen Bereich unter null. Unten der Aufbau des klassischen Feed-Forward-Netzes mit zwei Matrizen gegenüber der GLU-Variante mit drei Matrizen und einem elementweisen Produkt.</desc>

<style>
  .bg   { fill: #ffffff; }
  .hd   { fill: #2C2C2A; font-size: 16px; font-weight: 500; }
  .note { fill: #5F5E5A; font-size: 12px; }
  .t    { fill: #2C2C2A; font-size: 13px; }
  .cont { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
  .axis { stroke: #888780; stroke-width: 1.2; fill: none; }
  .grid { stroke: #D4D2CA; stroke-width: 0.8; fill: none; stroke-dasharray: 3 4; }
  .relu { stroke: #BA7517; stroke-width: 2.5; fill: none; }
  .relut{ fill: #854F0B; font-size: 13px; font-weight: 500; }
  .gelu { stroke: #0F6E56; stroke-width: 2.5; fill: none; }
  .gelut{ fill: #0F6E56; font-size: 13px; font-weight: 500; }
  .swi  { stroke: #534AB7; stroke-width: 2.5; fill: none; }
  .swit { fill: #534AB7; font-size: 13px; font-weight: 500; }
  .box  { fill: #E4E2DA; stroke: #5F5E5A; stroke-width: 0.5; }
  .boxt { fill: #2C2C2A; font-size: 13px; font-weight: 500; }
  .gate { fill: #9FE1CB; stroke: #0F6E56; stroke-width: 0.5; }
  .gatet{ fill: #04342C; font-size: 13px; font-weight: 500; }
  .act  { fill: #FAC775; stroke: #854F0B; stroke-width: 0.5; }
  .actt { fill: #412402; font-size: 13px; font-weight: 500; }
  .arr  { stroke: #888780; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #1a1a19; }
    .hd, .t { fill: #E8E6DE; }
    .note { fill: #B4B2A9; }
    .cont { fill: #232322; stroke: #B4B2A9; }
    .axis { stroke: #9C9A92; } .grid { stroke: #4A4A46; }
    .relu { stroke: #EF9F27; } .relut { fill: #FAC775; }
    .gelu { stroke: #5DCAA5; } .gelut { fill: #5DCAA5; }
    .swi  { stroke: #AFA9EC; } .swit  { fill: #AFA9EC; }
    .box  { fill: #3A3A37; stroke: #B4B2A9; } .boxt { fill: #E8E6DE; }
    .gate { fill: #085041; stroke: #5DCAA5; } .gatet { fill: #E1F5EE; }
    .act  { fill: #633806; stroke: #EF9F27; } .actt { fill: #FAEEDA; }
    .arr  { stroke: #9C9A92; }
  }
</style>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect class="bg" x="0" y="0" width="860" height="800"/>

<!-- PANEL A -->
<rect class="cont" x="20" y="20" width="820" height="400" rx="16"/>
<text class="hd" x="44" y="54">Die drei punktweisen Aktivierungsfunktionen</text>
<text class="note" x="44" y="76">Jede bildet eine Zahl auf eine Zahl ab — Koordinate für Koordinate, unabhängig voneinander</text>

<line class="grid" x1="210" y1="270" x2="640" y2="270"/>
<line class="grid" x1="210" y1="200" x2="640" y2="200"/>
<line class="grid" x1="210" y1="130" x2="640" y2="130"/>

<line class="axis" x1="205" y1="340" x2="645" y2="340"/>
<line class="axis" x1="420" y1="120" x2="420" y2="382"/>

<text class="note" x="220" y="360" text-anchor="middle">−3</text>
<text class="note" x="287" y="360" text-anchor="middle">−2</text>
<text class="note" x="353" y="360" text-anchor="middle">−1</text>
<text class="note" x="487" y="360" text-anchor="middle">1</text>
<text class="note" x="553" y="360" text-anchor="middle">2</text>
<text class="note" x="620" y="360" text-anchor="middle">3</text>
<text class="note" x="414" y="274" text-anchor="end">1</text>
<text class="note" x="414" y="204" text-anchor="end">2</text>
<text class="note" x="414" y="134" text-anchor="end">3</text>

<polyline class="relu" points="220,340 420,340 620,130"/>
<polyline class="gelu" points="220,340 287,343 320,347 353,351 370,352 387,351 420,340 453,316 487,281 520,242 553,203 587,166 620,130"/>
<polyline class="swi"  points="220,350 253,353 287,357 320,359 335,360 353,359 387,353 420,340 453,318 487,289 520,254 553,217 587,178 620,140"/>

<line class="relu" x1="240" y1="150" x2="272" y2="150"/>
<text class="relut" x="282" y="155">ReLU</text>
<line class="gelu" x1="240" y1="178" x2="272" y2="178"/>
<text class="gelut" x="282" y="183">GELU</text>
<line class="swi"  x1="240" y1="206" x2="272" y2="206"/>
<text class="swit" x="282" y="211">Swish</text>

<text class="note" x="672" y="200">ab x &gt; 2 praktisch</text>
<text class="note" x="672" y="218">nicht mehr zu</text>
<text class="note" x="672" y="236">unterscheiden</text>

<text class="note" x="672" y="290">links von null:</text>
<text class="note" x="672" y="308">ReLU exakt 0,</text>
<text class="note" x="672" y="326">GELU und Swish</text>
<text class="note" x="672" y="344">tauchen leicht</text>
<text class="note" x="672" y="362">unter null</text>

<text class="note" x="430" y="398" text-anchor="middle">Der ganze Unterschied liegt in einem schmalen Band um den Nullpunkt</text>

<!-- PANEL B -->
<rect class="cont" x="20" y="440" width="820" height="340" rx="16"/>
<text class="hd" x="44" y="474">Der eigentliche Unterschied ist nicht die Kurve, sondern die Struktur</text>

<text class="t" x="44" y="508">Klassisches FFN — zwei Matrizen</text>

<rect class="box" x="44" y="522" width="80" height="44" rx="8"/>
<text class="boxt" x="84" y="549" text-anchor="middle">x</text>
<rect class="box" x="158" y="522" width="100" height="44" rx="8"/>
<text class="boxt" x="208" y="549" text-anchor="middle">W₁</text>
<rect class="act" x="292" y="522" width="140" height="44" rx="8"/>
<text class="actt" x="362" y="549" text-anchor="middle">ReLU / GELU / Swish</text>
<rect class="box" x="466" y="522" width="100" height="44" rx="8"/>
<text class="boxt" x="516" y="549" text-anchor="middle">W₂</text>
<rect class="box" x="600" y="522" width="100" height="44" rx="8"/>
<text class="boxt" x="650" y="549" text-anchor="middle">Ausgabe</text>

<line class="arr" x1="126" y1="544" x2="154" y2="544" marker-end="url(#a)"/>
<line class="arr" x1="260" y1="544" x2="288" y2="544" marker-end="url(#a)"/>
<line class="arr" x1="434" y1="544" x2="462" y2="544" marker-end="url(#a)"/>
<line class="arr" x1="568" y1="544" x2="596" y2="544" marker-end="url(#a)"/>

<text class="note" x="44" y="588">verborgene Dimension d_ff = 3072</text>

<text class="t" x="44" y="632">GLU-Variante — drei Matrizen, ein Produkt</text>

<rect class="box" x="44" y="676" width="80" height="44" rx="8"/>
<text class="boxt" x="84" y="703" text-anchor="middle">x</text>

<rect class="box" x="158" y="646" width="70" height="40" rx="8"/>
<text class="boxt" x="193" y="671" text-anchor="middle">W</text>
<rect class="act" x="252" y="646" width="110" height="40" rx="8"/>
<text class="actt" x="307" y="671" text-anchor="middle">Swish</text>

<rect class="box" x="158" y="712" width="204" height="40" rx="8"/>
<text class="boxt" x="260" y="737" text-anchor="middle">V   (ohne Aktivierung)</text>

<rect class="gate" x="392" y="676" width="60" height="44" rx="8"/>
<text class="gatet" x="422" y="703" text-anchor="middle">⊗</text>

<rect class="box" x="486" y="676" width="100" height="44" rx="8"/>
<text class="boxt" x="536" y="703" text-anchor="middle">W₂</text>
<rect class="box" x="620" y="676" width="100" height="44" rx="8"/>
<text class="boxt" x="670" y="703" text-anchor="middle">Ausgabe</text>

<path class="arr" d="M126 692 L142 692 L142 666 L154 666" marker-end="url(#a)"/>
<path class="arr" d="M126 704 L142 704 L142 732 L154 732" marker-end="url(#a)"/>
<line class="arr" x1="230" y1="666" x2="248" y2="666" marker-end="url(#a)"/>
<path class="arr" d="M364 666 L378 666 L378 692 L388 692" marker-end="url(#a)"/>
<path class="arr" d="M364 732 L378 732 L378 704 L388 704" marker-end="url(#a)"/>
<line class="arr" x1="454" y1="698" x2="482" y2="698" marker-end="url(#a)"/>
<line class="arr" x1="588" y1="698" x2="616" y2="698" marker-end="url(#a)"/>

<text class="note" x="744" y="640">d_ff wird auf 2/3</text>
<text class="note" x="744" y="658">gekürzt: 2048</text>
<text class="note" x="744" y="676">→ gleiche Parameter-</text>
<text class="note" x="744" y="694">zahl wie oben</text>

</svg>
